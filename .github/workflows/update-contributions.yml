name: Update profile contribution dashboard

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch actual contributions and generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_contributions.py

      - name: Commit updated SVG when changed
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "Dashboard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore(profile): refresh contribution calendar"
          git push